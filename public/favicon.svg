<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur" in2="Source"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with gradient -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow circles -->
  <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,0.08)"/>

  <!-- Outer ring with glow -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" filter="url(#glow)"/>

  <!-- Compass: 4 directional arrows with glow -->
  <!-- North -->
  <polygon points="50,12 58,26 42,26" fill="url(#compassGrad)" filter="url(#glow)"/>
  <!-- South -->
  <polygon points="50,88 42,74 58,74" fill="url(#compassGrad)" filter="url(#glow)"/>
  <!-- East -->
  <polygon points="88,50 74,42 74,58" fill="url(#compassGrad)" filter="url(#glow)"/>
  <!-- West -->
  <polygon points="12,50 26,42 26,58" fill="url(#compassGrad)" filter="url(#glow)"/>

  <!-- Center dot with glow -->
  <circle cx="50" cy="50" r="6" fill="url(#compassGrad)" filter="url(#glow)"/>

  <!-- Inner connecting lines -->
  <line x1="50" y1="26" x2="50" y2="74" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="26" y1="50" x2="74" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
</svg>