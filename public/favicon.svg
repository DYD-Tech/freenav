<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Minimalist compass: just 4 thin lines with arrows -->
  <line x1="50" y1="22" x2="50" y2="46" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="50" y2="78" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="46" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="50" x2="78" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="white"/>

  <!-- N directional arrow -->
  <path d="M50,22 L55,30 L45,30 Z" fill="white"/>
</svg>