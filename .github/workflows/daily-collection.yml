name: Daily Resource Collection

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run full collection pipeline'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --legacy-peer-deps

      - name: Collect resources
        run: npm run collect
        continue-on-error: true

      - name: Deduplicate
        run: npm run dedupe
        continue-on-error: true

      - name: Build site
        run: npm run build

      - name: Commit data changes
        run: |
          git config user.name 'freenav-bot[bot]'
          git config user.email '41896+freenav-bot[bot]@users.noreply.github.com'
          git add src/data/
          git diff --staged --quiet || git commit -m "content: daily resource update ($(date +%Y-%m-%d))"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        run: |
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/DYD-Tech/freenav.git HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5
        with:
          pages-path: 'dist'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4